<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderner Timer</title>

<style>
:root {
    --bg: #f4f6f8;
    --primary: #2563eb;
    --danger: #dc2626;
    --accent: #16a34a;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    text-align: center;
    transition: background-color 0.5s;
    touch-action: manipulation;
}

#progress {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(#22c55e, #15803d);
    z-index: -1;
    height: 100%;
    transition: height 1s linear;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

input, select {
    width: 100%;
    font-size: 1.4rem;
    padding: 12px;
    margin: 6px 0;
    border-radius: 12px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 16px;
    margin: 6px 0;
    font-size: 1.5rem;
    border-radius: 14px;
    border: none;
    color: white;
    background: var(--primary);
}

button.secondary { background: #64748b; }
button.danger { background: var(--danger); }

#toneBtn { background: #0f766e; }

#timeDisplay {
    font-size: 6rem;
    margin: 20px 0;
    font-weight: 800;
}

#finished {
    display: none;
    font-size: 4rem;
    font-weight: 800;
    margin-top: 20px;
}

label {
    font-size: 1.2rem;
    margin-top: 10px;
    display: block;
}
</style>
</head>

<body>
<div id="progress"></div>

<div class="container">
    <h1>Timer</h1>

    <input type="number" id="timeInput" min="1">
    <select id="unit">
        <option value="seconds">Sekunden</option>
        <option value="minutes">Minuten</option>
    </select>

    <label>Lautstärke</label>
    <input type="range" id="volume" min="0" max="100">

    <button id="toneBtn">Ton: AN</button>

    <button id="startBtn">Start</button>
    <button id="pauseBtn" class="secondary">Pause</button>
    <button id="resetBtn" class="danger">Reset</button>

    <div id="timeDisplay">00:00</div>
    <div id="finished">Die Zeit ist abgelaufen</div>
</div>

<script>
let total = 0, remaining = 0, timer = null, paused = false;
let soundOn = true;
let volume = 0.5;
let blink = null;

const $ = id => document.getElementById(id);

function savePreset() {
    localStorage.setItem("timerPreset", JSON.stringify({
        time: $("timeInput").value,
        unit: $("unit").value,
        soundOn,
        volume
    }));
}

function loadPreset() {
    const data = JSON.parse(localStorage.getItem("timerPreset"));
    if (!data) return;
    $("timeInput").value = data.time;
    $("unit").value = data.unit;
    soundOn = data.soundOn;
    volume = data.volume;
    $("volume").value = volume * 100;
    updateToneBtn();
}

function format(sec) {
    return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}

function update() {
    $("timeDisplay").textContent = format(remaining);
    $("progress").style.height = (remaining / total * 100) + "%";
}

$("startBtn").onclick = () => {
    if (timer) return;
    if (remaining === 0) {
        total = parseInt($("timeInput").value) * ($("unit").value === "minutes" ? 60 : 1);
        remaining = total;
        $("finished").style.display = "none";
        stopBlink();
    }
    savePreset();
    timer = setInterval(() => {
        if (!paused) {
            remaining--;
            update();
            if (remaining <= 0) finish();
        }
    }, 1000);
};

$("pauseBtn").onclick = () => paused = !paused;

$("resetBtn").onclick = () => {
    clearInterval(timer);
    timer = null;
    remaining = 0;
    $("progress").style.height = "0";
    $("timeDisplay").textContent = "00:00";
    $("finished").style.display = "none";
    stopBlink();
};

function finish() {
    clearInterval(timer);
    timer = null;
    $("finished").style.display = "block";
    startBlink();
    if (soundOn) playSound();
}

function startBlink() {
    let f = false;
    blink = setInterval(() => {
        document.body.style.background = f ? "#fde047" : "#ef4444";
        f = !f;
    }, 1000);
}
function stopBlink() {
    clearInterval(blink);
    document.body.style.background = "";
}

function updateToneBtn() {
    $("toneBtn").textContent = soundOn ? "Ton: AN" : "Ton: AUS";
}

$("toneBtn").onclick = () => {
    soundOn = !soundOn;
    updateToneBtn();
    savePreset();
};

$("volume").oninput = e => {
    volume = e.target.value / 100;
    savePreset();
};

function playSound() {
    const ctx = new AudioContext();
    [523, 659, 784, 1046].forEach((f,i)=>{
        let o = ctx.createOscillator();
        let g = ctx.createGain();
        o.frequency.value=f;
        g.gain.value=volume;
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime+i*0.3);
        o.stop(ctx.currentTime+i*0.3+0.8);
    });
}

loadPreset();
updateToneBtn();
</script>
</body>
</html>
