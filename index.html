<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Timer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: white;
    }

    #progress {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: green;
        z-index: -1;
        height: 100%;
        transition: height 1s linear;
    }

    #container {
        padding-top: 30px;
        min-height: 100vh;
        transition: background-color 0.5s;
    }

    input, select, button {
        font-size: 1.2rem;
        padding: 10px;
        margin: 5px;
    }

    #timeDisplay {
        font-size: 6rem;
        font-weight: bold;
        margin: 30px 0;
    }

    #finishedText {
        font-size: 5rem;
        font-weight: bold;
        color: black;
        display: none;
        margin-top: 40px;
    }

    .blink-yellow {
        background-color: yellow;
    }

    .blink-red {
        background-color: red;
    }

    #timeInput {
        width: 80px;
        text-align: center;
    }
</style>
</head>

<body>

<div id="progress"></div>

<div id="container">
    <input type="number" id="timeInput" min="1" value="10">
    <select id="unitSelect">
        <option value="seconds">Sekunden</option>
        <option value="minutes">Minuten</option>
    </select>
    <br>

    <button id="soundBtn">Ton: AN</button>
    <br>

    <button id="startBtn">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>

    <div id="timeDisplay">00:00</div>
    <div id="finishedText">Die Zeit ist abgelaufen</div>
</div>

<script>
let totalSeconds = 0;
let remainingSeconds = 0;
let interval = null;
let paused = false;
let blinkInterval = null;
let soundOn = true;

/* ✅ AudioContext (wird per Klick freigeschaltet) */
let audioCtx = null;

const timeDisplay = document.getElementById("timeDisplay");
const progress = document.getElementById("progress");
const finishedText = document.getElementById("finishedText");
const soundBtn = document.getElementById("soundBtn");
const container = document.getElementById("container");

function formatTime(sec) {
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function updateDisplay() {
    timeDisplay.textContent = formatTime(remainingSeconds);
    let percent = (remainingSeconds / totalSeconds) * 100;
    progress.style.height = percent + "%";
}

function startTimer() {

    /* ✅ AudioContext darf nur hier erzeugt werden (Benutzeraktion!) */
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (interval) return;

    if (remainingSeconds <= 0) {
        let input = parseInt(document.getElementById("timeInput").value);
        let unit = document.getElementById("unitSelect").value;
        totalSeconds = unit === "minutes" ? input * 60 : input;
        remainingSeconds = totalSeconds;
        progress.style.height = "100%";
        finishedText.style.display = "none";
        stopBlinking();
    }

    interval = setInterval(() => {
        if (!paused) {
            remainingSeconds--;
            updateDisplay();
            if (remainingSeconds <= 0) {
                clearInterval(interval);
                interval = null;
                timerFinished();
            }
        }
    }, 1000);
}

function pauseTimer() {
    paused = !paused;
}

function resetTimer() {
    clearInterval(interval);
    interval = null;
    totalSeconds = 0;
    remainingSeconds = 0;
    paused = false;
    timeDisplay.textContent = "00:00";
    progress.style.height = "0";
    finishedText.style.display = "none";
    stopBlinking();
}

function timerFinished() {
    finishedText.style.display = "block";
    startBlinking();
    if (soundOn) playMarimba();
}

function startBlinking() {
    let toggle = false;
    blinkInterval = setInterval(() => {
        container.className = toggle ? "blink-yellow" : "blink-red";
        toggle = !toggle;
    }, 1000);
}

function stopBlinking() {
    clearInterval(blinkInterval);
    container.className = "";
}

soundBtn.onclick = () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "Ton: AN" : "Ton: AUS";
};

document.getElementById("startBtn").onclick = startTimer;
document.getElementById("pauseBtn").onclick = pauseTimer;
document.getElementById("resetBtn").onclick = resetTimer;

function playMarimba() {
    if (!audioCtx) return;

    const notes = [523, 659, 784, 1046];

    notes.forEach((freq, i) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();

        osc.frequency.value = freq;
        osc.type = "sine";

        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + i * 0.3 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.3 + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + i * 0.3);
        osc.stop(audioCtx.currentTime + i * 0.3 + 1);
    });
}
</script>

</body>
</html>
